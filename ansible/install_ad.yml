- name: Install AD DS
  hosts: domain_members
  gather_facts: no

  tasks:
    - name: Install AD DS
      register: windows_installs
      ansible.windows.win_feature:
        name:
          - AD-Domain-Services
        include_management_tools: true
        state: present

    - name: Reboot server if required
      when: windows_installs.reboot_required
      ansible.windows.win_reboot:
